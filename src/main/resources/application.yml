spring:
  application:
    name: crypto-market-scanner
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require}
    username: ${SUPABASE_DB_USERNAME:postgres.wdsxcflkxixvwaqnltkk}
    password: ${SUPABASE_DB_PASSWORD:DhlDi1wQn4XqC749}
    hikari:
      connection-init-sql: "SET TIME ZONE 'Europe/Istanbul'"
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Istanbul
  flyway:
    enabled: true

binance:
  futures-base-url: https://fapi.binance.com
  timeout-seconds: 10
  max-in-memory-size-mb: 10

scanner:
  safe-mode: true
  blacklist: []

  scheduler:
    enabled: true
    one-hour-cron: "0 2 * * * *"
    four-hour-cron: "0 2 3,7,11,15,19,23 * * *"
    zone: "Europe/Istanbul"

  paper-auto:
    enabled: true
    open-after-scan: true
    evaluate-enabled: true
    evaluate-cron: "0 */5 * * * *"
    zone: "Europe/Istanbul"

  liquidity:
    min-quote-volume-24h: 30000000
    max-spread-pct: 0.08
    max-pump-24h-pct: 25
    max-dump-24h-pct: -25

  klines:
    one-hour-limit: 250
    four-hour-limit: 250
    min-closed-candles: 220

  market-regime:
    breadth-risk-on-min-pct: 35
    breadth-strong-pct: 60
    breadth-risk-off-max-pct: 20
    panic-btc-24h-drop-pct: -5
    panic-btc-4h-drop-pct: -3
    panic-volume-ratio-1h: 1.5
    panic-volume-ratio-4h-rule: 1.8

  funding:
    warning-positive: 0.0005
    warning-negative: -0.0005
    danger-positive: 0.001
    danger-negative: -0.001

  scoring:
    strong-threshold: 80
    watchlist-threshold: 65
    eliminated-threshold: 50
    direction-difference-threshold: 10

  entry-candidate:
    enabled: true
    max-candidates: 10
    min-score: 70
    allow-watchlist: false
    allow-neutral-watchlist: false
    allow-high-risk: false
    max-long-candidates: 5
    max-short-candidates: 5

  entry-signal:
    enabled: true
    min-enter-score: 75
    min-strong-enter-score: 80
    allow-watchlist-entry: false
    allow-medium-risk-entry: true
    allow-high-risk-entry: false
    max-spread-pct: 0.08
    max-long-24h-change-pct: 18
    max-short-24h-dump-pct: -18
    min-quote-volume-24h: 30000000
    long-late-bb-outside-chase-bypass-enabled: true
    long-late-bb-outside-price-change-threshold-pct: 5
    long-late-bb-outside-bb-percent-b-threshold: 1.0
    block-market-chop: false
    require-volume-confirmed: false

  paper:
    enabled: true
    default-notional-usdt: 100
    leverage: 3
    allow-multiple-open-same-symbol: false
    max-open-positions: 5
    max-open-long-positions: 3
    max-open-short-positions: 3
    allow-medium-risk: true
    allow-high-risk: false
    min-entry-priority-score: 65

  entry-priority:
    risk-penalty-low: 0
    risk-penalty-medium: 5
    risk-penalty-high: 15
    spread-penalty-low-threshold: 0.03
    spread-penalty-mid-threshold: 0.06
    spread-penalty-mid: 3
    spread-penalty-high: 6
    funding-warning-penalty: 5
    funding-danger-penalty: 10
    volume-bonus-strong-threshold: 1.2
    volume-bonus-strong: 5
    volume-bonus-strong-with-4h-confirmation: 8
    volume-bonus-normal: 2
    regime-alignment-bonus: 5
    regime-opposite-penalty: 10
    chop-penalty: 5
    four-hour-alignment-bonus: 10
    four-hour-strong-alignment-bonus: 20
    four-hour-against-trend-penalty-long: 15
    four-hour-against-trend-penalty-short: 20
    four-hour-macd-opposite-penalty: 10
    four-hour-rsi-late-long-penalty: 10
    four-hour-rsi-late-short-penalty: 15
    short-not-risk-off-penalty: 20
    short-btc-4h-up-penalty: 15
    short-symbol-4h-up-penalty: 20
    short-rsi-low-penalty: 10
    short-price-dump-penalty: 10
    short-negative-funding-penalty: 10
    symbol-recent-stop-count-window-hours: 24
    symbol-recent-stop-count-threshold: 2
    symbol-recent-stop-penalty: 25
    five-minute-bb-timing-enabled: true
    five-minute-bb-penalty: 3
    five-minute-window-bars: 4
    long-5m-chase-bb-percent-b: 1.0
    long-5m-chase-window-return-pct: 0.35
    long-5m-weakness-window-return-pct: -0.25
    long-5m-weakness-bb-percent-b: 0.40
    short-5m-chase-bb-percent-b: 0.0
    short-5m-chase-window-return-pct: -0.35
    short-5m-weakness-window-return-pct: 0.25
    short-5m-weakness-bb-percent-b: 0.60

  paper-risk:
    atr-stop-multiplier: 1.2
    min-stop-distance-pct: 0.007
    max-stop-distance-pct: 0.018
    tp1-r-multiple: 1.0
    tp2-r-multiple: 2.0
    tp1-close-pct: 50
    tp2-close-pct: 25
    trailing-remaining-pct: 25
    fee-buffer-pct: 0.0005
    trailing-atr-multiplier: 1.2

  paper-cost:
    leverage: 3
    taker-fee-pct: 0.0004
    slippage-pct: 0.0005

  exit:
    long-no-follow-through-enabled: true
    long-no-follow-through-minutes: 15
    long-no-follow-through-mfe-threshold-pct: 0.40

  paper-exit:
    enabled: true
    take-profit-pct: 1.0
    stop-loss-pct: 0.6
    time-stop-minutes: 240
    time-stop-close-only-if-non-positive: true
    bar-minutes: 60
    intrabar-check-enabled: true
    intrabar-interval: "5m"
    intrabar-cron: "10 */5 * * * *"
    intrabar-zone: "Europe/Istanbul"
    intrabar-kline-limit: 3
logging:
  jsonl:
    scanner-path: logs/scanner
    entry-path: logs/entry
    paper-path: logs/paper
    append-only: true
  pattern:
    dateformat: "yyyy-MM-dd HH:mm:ss.SSS,Europe/Istanbul"
  level:
    reactor.netty.http.client.HttpClientConnect: ERROR
    reactor.netty.resources.DefaultPooledConnectionProvider: ERROR
    reactor.netty.channel.FluxReceive: ERROR
    org.springframework.web.reactive.function.client.ExchangeFunctions: ERROR
